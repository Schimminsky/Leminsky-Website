name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # `biome ci` statt `biome check`: schreibt nichts und liefert die für CI
      # passenden Exit-Codes.
      - name: Lint und Formatierung
        run: bunx biome ci .

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
